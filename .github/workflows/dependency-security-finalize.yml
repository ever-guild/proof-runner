name: Temporary dependency security finalization

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize-security-fix:
    if: github.event.pull_request.head.ref == 'agent/fix-dependabot-alerts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Apply supported React Router v8 migration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          delete packageJson.dependencies['react-router-dom']
          packageJson.dependencies['react-router'] = '8.3.0'
          packageJson.dependencies = Object.fromEntries(
            Object.entries(packageJson.dependencies).sort(([left], [right]) => left.localeCompare(right)),
          )
          packageJson.engines.node = '>=22.22.0'
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)

          const workspacePath = 'pnpm-workspace.yaml'
          const workspace = fs.readFileSync(workspacePath, 'utf8')
          const beforeOverrides = workspace.split('overrides:\n')[0]
          fs.writeFileSync(
            workspacePath,
            `${beforeOverrides}overrides:\n  brace-expansion: 5.0.8\n  valibot@<=1.4.1: 1.4.2\n`,
          )
          NODE

          while IFS= read -r -d '' file; do
            sed -i 's/react-router-dom/react-router/g' "$file"
          done < <(git grep -lz 'react-router-dom' -- '*.ts' '*.tsx')

          sed -i 's/Requires Node.js 22 or newer/Requires Node.js 22.22.0 or newer/' README.md
          rm -f package-lock.json
          if ! grep -qxF '/package-lock.json' .gitignore; then
            printf '\n# This repository uses pnpm as its sole workspace package manager.\n/package-lock.json\n' >> .gitignore
          fi

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify reproducible installation
        run: pnpm install --frozen-lockfile

      - name: Verify dependency audit is clean
        run: pnpm audit --audit-level=low

      - name: Verify dependency alignment
        run: |
          pnpm why react-router
          pnpm why brace-expansion
          pnpm why valibot
          test ! -e package-lock.json
          ! git grep -n 'react-router-dom' -- '*.ts' '*.tsx' package.json pnpm-lock.yaml

      - name: Install browser test dependencies
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run test suite
        run: pnpm test

      - name: Run type checks
        run: pnpm typecheck

      - name: Run lint checks
        run: pnpm lint

      - name: Run production build
        run: pnpm build

      - name: Commit verified dependency fix
        if: success()
        run: |
          rm -f .github/workflows/dependency-security-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deps): complete supported security upgrades"
          git push origin HEAD:agent/fix-dependabot-alerts
