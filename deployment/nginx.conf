server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health/live { access_log off; add_header Content-Type text/plain; return 200 "live\n"; }
  location = /health/ready { access_log off; add_header Content-Type text/plain; return 200 "ready\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
