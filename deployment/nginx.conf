server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health/live { access_log off; add_header Content-Type text/plain; return 200 "live\n"; }
  location = /health/ready { access_log off; add_header Content-Type text/plain; return 200 "ready\n"; }

  location = /internal {
    return 404;
  }

  location ^~ /internal/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location /a2mcp/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location ~ ^/(receipts|examples)/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    if ($http_user_agent ~* (facebookexternalhit|twitterbot|slackbot|linkedinbot|bot|crawler|spider)) {
      proxy_pass http://api:8787;
    }
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
