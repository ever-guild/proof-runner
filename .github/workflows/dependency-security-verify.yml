name: Temporary dependency security verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify-security-fix:
    if: github.event.pull_request.head.ref == 'agent/fix-dependabot-alerts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile for security overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify reproducible installation
        run: pnpm install --frozen-lockfile

      - name: Verify dependency audit is clean
        run: pnpm audit --audit-level=low

      - name: Install browser test dependencies
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run test suite
        run: pnpm test

      - name: Run type checks
        run: pnpm typecheck

      - name: Run lint checks
        run: pnpm lint

      - name: Run production build
        run: pnpm build

      - name: Remove helper workflow and commit lockfile
        if: always()
        run: |
          rm -f .github/workflows/dependency-security-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No additional dependency changes were produced."
          else
            git commit -m "chore(deps): synchronize security overrides"
            git push origin HEAD:agent/fix-dependabot-alerts
          fi
