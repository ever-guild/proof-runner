server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health/live { access_log off; add_header Content-Type text/plain; return 200 "live\n"; }
  location = /health/ready { access_log off; add_header Content-Type text/plain; return 200 "ready\n"; }
  # API endpoints
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /a2mcp/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /internal/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Bot crawler proxying for receipt Open Graph link previews
  location ~ ^/(receipts|examples)/ {
    if ($http_user_agent ~* (facebookexternalhit|twitterbot|slackbot|linkedinbot|bot|crawler|spider)) {
      proxy_pass http://api:8787;
    }
    try_files $uri $uri/ /index.html;
  }

  # Default SPA fallback for all web app routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}

